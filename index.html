    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var origError = console.error;
            console.error = function() {
              try {
                var msg = arguments && arguments[0];
                if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
                  return;
                }
              } catch (e) {}
              if (origError) origError.apply(console, arguments);
            };
            var origWarn = console.warn;
            console.warn = function() {
              try {
                var msg = arguments && arguments[0];
                if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
                  return;
                }
              } catch (e) {}
              if (origWarn) origWarn.apply(console, arguments);
            };
          }
        } catch (e) {}
      })();
    </script>

    <script>
      // Automatic recovery if PWA ServiceWorker serves stale cached index.html or script fails
      window.addEventListener('error', function(e) {
        var src = (e.target && e.target.src) || '';
        if (src.indexOf('main.tsx') !== -1 || src.indexOf('.js') !== -1) {
          console.warn('Script loading error detected, clearing stale ServiceWorkers...');
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var reg of registrations) {
                reg.unregister();
              }
              window.location.reload(true);
            });
          }
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
